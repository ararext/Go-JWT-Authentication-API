services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGODB_URI=mongodb://mongo:27017
      - DATABASE_NAME=jwt_auth
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - ACCESS_TOKEN_DURATION=15m
      - REFRESH_TOKEN_DURATION=168h
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data: